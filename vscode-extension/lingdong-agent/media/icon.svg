<!--
  活动栏图标：按品牌标记（L + 右向折角）重画的扁平线稿。
  必须是单色且用 currentColor —— 活动栏图标要跟随主题反色，彩色位图在这里用不了。
  品牌标记本身靠三维折面表达体积，那套在 24px 下会糊成一团，所以只保留骨架。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M7 4.5V16.5h5.5" />
  <path d="M13.5 7.5 18.5 12l-5 4.5" />
</svg>
